[project]
name = "qq-media-archiver"
version = "0.1.0"
description = "QQ 群媒体自动归档系统 - 自动保存群内图片、视频、文件并分类存储"
requires-python = ">=3.11"
dependencies = [
    "nonebot2[fastapi]>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "aiohttp>=3.10.0",
    "aiofiles>=24.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "Pillow>=10.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
